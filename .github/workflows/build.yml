name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP and find project root
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл не найден!"
            exit 1
          fi
          
          echo "Найден архив: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_files
          
          SETTINGS_FILE=$(find extracted_files -name "settings.gradle*" -print -quit)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
            echo "Корень проекта найден в папке: $PROJECT_ROOT"
            cp -r "$PROJECT_ROOT"/* . || true
            cp -r "$PROJECT_ROOT"/.[!.]* . || true
          else
            cp -r extracted_files/* . || true
          fi
          
          rm -rf extracted_files
          rm "$ZIP_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.5.0' # <--- ИЗМЕНЕНИЕ ЗДЕСЬ

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nurvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
