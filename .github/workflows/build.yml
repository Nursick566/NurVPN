name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          # Ищем любой ZIP-файл в корне репозитория
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл не найден в репозитории!"
            exit 1
          fi
          
          echo "Найден архив: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_files
          
          # Переносим всё из архива в корень
          cp -r extracted_files/* . || true
          rm -rf extracted_files
          rm "$ZIP_FILE"
          
          echo "Проверка содержимого папки:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Файл gradlew отсутствует. Генерируем..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nurvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
